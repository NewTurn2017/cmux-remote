<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: Geist;
      src: url("../../ios/CmuxRemote/Resources/Fonts/GeistMono-Medium.ttf");
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b12;
      color: #c0caf5;
      font-family: Geist, ui-monospace, monospace;
    }
    body { padding: 28px; }
    header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 500; }
    .badge {
      padding: 7px 12px;
      color: #9ece6a;
      border: 1px solid #3b4261;
      border-radius: 8px;
      font-size: 15px;
    }
    main {
      height: calc(100% - 54px);
      display: grid;
      gap: 18px;
      align-items: center;
    }
    .phone main { grid-template-columns: repeat(5, 1fr); }
    .ipad main { grid-template-columns: repeat(3, 1fr); }
    .card {
      min-width: 0;
      padding: 8px;
      border: 1px solid #3b4261;
      border-radius: 16px;
      background: #1a1b26;
      box-shadow: 0 18px 48px rgba(0,0,0,.45);
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header><h1 id="title"></h1><span class="badge">ASC REVIEW · 1.1.1</span></header>
  <main id="frames"></main>
  <script>
    const query = new URLSearchParams(location.search);
    const device = query.get("device") === "ipad-13" ? "ipad-13" : "iphone-6.9";
    const locale = query.get("locale") === "en" ? "en" : "ko";
    const files = device === "iphone-6.9"
      ? [
          "01-remote-command-center.png",
          "02-truecolor-selection-copy.png",
          "03-terminal-files-preview.png",
          "04-compact-command-deck.png",
          "05-private-tailscale.png"
        ]
      : [
          "01-full-width-terminal.png",
          "02-files-beside-terminal.png",
          "03-workspaces-at-a-glance.png"
        ];
    document.body.className = device === "ipad-13" ? "ipad" : "phone";
    document.getElementById("title").textContent = `cmux Remote · ${device} · ${locale.toUpperCase()}`;
    document.getElementById("frames").innerHTML = files
      .map(file => `<div class="card"><img src="../../docs/launch-assets/screenshots/1.1.1/${device}/${locale}/${file}"></div>`)
      .join("");
  </script>
</body>
</html>
