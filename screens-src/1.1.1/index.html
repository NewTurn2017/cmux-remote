<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>cmux Remote 1.1.1 App Store Screenshots</title>
  <style>
    @font-face {
      font-family: Departure;
      src: url("../../ios/CmuxRemote/Resources/Fonts/DepartureMono-Regular.otf");
    }
    @font-face {
      font-family: Geist;
      src: url("../../ios/CmuxRemote/Resources/Fonts/GeistMono-Regular.ttf");
      font-weight: 400;
    }
    @font-face {
      font-family: Geist;
      src: url("../../ios/CmuxRemote/Resources/Fonts/GeistMono-Medium.ttf");
      font-weight: 500;
    }
    @font-face {
      font-family: Geist;
      src: url("../../ios/CmuxRemote/Resources/Fonts/GeistMono-Bold.ttf");
      font-weight: 700;
    }

    :root {
      --canvas: #1a1b26;
      --terminal: #000;
      --surface: #24283b;
      --raised: #292e42;
      --sunken: #1f2335;
      --ink: #c0caf5;
      --ink-dim: #a9b1d6;
      --terminal-text: #f1f2f8;
      --muted: #565f89;
      --divider: #3b4261;
      --green: #9ece6a;
      --blue: #7aa2f7;
      --cyan: #7dcfff;
      --yellow: #e0af68;
      --orange: #ff9e64;
      --red: #f7768e;
      --magenta: #bb9af7;
      --purple: #9d7cd8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: white;
      background: #090b12;
      font-family: Geist, ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    body.phone { width: 1320px; height: 2868px; }
    body.ipad { width: 2752px; height: 2064px; }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 16% 22%, rgba(122,162,247,.26), transparent 31%),
        radial-gradient(circle at 83% 28%, rgba(187,154,247,.20), transparent 32%),
        radial-gradient(circle at 55% 82%, rgba(158,206,106,.12), transparent 34%),
        linear-gradient(145deg, #090b12 0%, #111528 47%, #0c101a 100%);
    }
    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .24;
      background-image:
        linear-gradient(rgba(122,162,247,.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122,162,247,.09) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: linear-gradient(to bottom, black, transparent 76%);
    }
    .stage::after {
      content: "";
      position: absolute;
      left: -10%;
      right: -10%;
      bottom: -7%;
      height: 42%;
      z-index: -1;
      background: linear-gradient(115deg, rgba(122,162,247,.14), rgba(187,154,247,.20), rgba(158,206,106,.12));
      filter: blur(90px);
      transform: skewY(-7deg);
    }

    .brand {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: Departure, monospace;
      font-size: 28px;
      letter-spacing: 2px;
      color: var(--ink);
      z-index: 4;
    }
    .phone .brand { top: 86px; left: 76px; }
    .ipad .brand { top: 68px; left: 104px; font-size: 30px; }
    .brand-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 28px rgba(158,206,106,.85);
    }
    .brand strong { color: var(--green); font-weight: 400; }
    .version {
      margin-left: 10px;
      padding: 7px 12px 6px;
      color: var(--muted);
      border: 1px solid var(--divider);
      border-radius: 8px;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .headline {
      position: absolute;
      z-index: 5;
      font-weight: 700;
      letter-spacing: -5px;
      text-wrap: balance;
      text-shadow: 0 20px 70px rgba(0,0,0,.55);
    }
    .sub {
      position: absolute;
      z-index: 5;
      color: rgba(241,242,248,.72);
      font-weight: 500;
      text-wrap: balance;
    }
    .phone .headline {
      top: 170px;
      left: 76px;
      width: 1168px;
      text-align: center;
      font-size: 108px;
      line-height: 1.08;
    }
    .phone .sub {
      top: 438px;
      left: 126px;
      width: 1068px;
      text-align: center;
      font-size: 35px;
      line-height: 1.45;
    }
    .ipad .headline {
      top: 128px;
      left: 130px;
      width: 2492px;
      text-align: center;
      font-size: 95px;
      line-height: 1.08;
    }
    .ipad .sub {
      top: 352px;
      left: 280px;
      width: 2192px;
      text-align: center;
      font-size: 34px;
      line-height: 1.4;
    }

    .device {
      position: absolute;
      z-index: 3;
      background: #06070a;
      border: 2px solid rgba(255,255,255,.16);
      box-shadow:
        0 70px 180px rgba(0,0,0,.72),
        0 0 0 8px rgba(59,66,97,.55),
        inset 0 0 0 2px rgba(255,255,255,.08);
      overflow: hidden;
    }
    .phone-device {
      left: 177px;
      top: 624px;
      width: 966px;
      height: 2174px;
      padding: 20px;
      border-radius: 112px 112px 86px 86px;
    }
    .phone-screen {
      position: relative;
      width: 926px;
      height: 2134px;
      overflow: hidden;
      border-radius: 92px 92px 68px 68px;
      background: #000;
    }
    .phone-screen::before {
      content: "";
      position: absolute;
      z-index: 40;
      width: 286px;
      height: 76px;
      left: 320px;
      top: 24px;
      border-radius: 42px;
      background: #06070a;
    }
    .ipad-device {
      left: 151px;
      top: 486px;
      width: 2450px;
      height: 1500px;
      padding: 20px;
      border-radius: 80px;
    }
    .ipad-screen {
      position: relative;
      width: 2410px;
      height: 1460px;
      overflow: hidden;
      border-radius: 60px;
      background: #000;
    }

    .ios-status {
      height: 96px;
      padding: 0 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--ink);
      background: #000;
      font-family: Departure, monospace;
      font-size: 26px;
      letter-spacing: 1px;
    }
    .ios-status-right { display: flex; align-items: center; gap: 16px; }
    .signal { letter-spacing: 1px; color: var(--ink-dim); }
    .battery {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 69px;
      height: 33px;
      border-radius: 8px;
      border: 2px solid var(--divider);
      color: var(--green);
      font-size: 18px;
    }
    .ipad .ios-status {
      height: 72px;
      padding: 0 46px;
      font-size: 21px;
    }

    .app-shell {
      position: absolute;
      inset: 96px 0 0;
      background: #000;
      display: flex;
      flex-direction: column;
    }
    .ipad .app-shell { inset: 72px 0 0; }

    .terminal-header {
      flex: none;
      padding: 24px 28px 18px;
      background: #000;
    }
    .header-row {
      height: 94px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .square-button, .header-main, .file-button {
      height: 88px;
      border: 2px solid var(--divider);
      background: var(--sunken);
      color: var(--ink);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .square-button, .file-button { width: 88px; flex: none; font-size: 32px; }
    .header-main {
      flex: 1;
      justify-content: flex-start;
      gap: 16px;
      padding: 0 22px;
      font-size: 28px;
      overflow: hidden;
    }
    .online {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 20px rgba(158,206,106,.75);
      flex: none;
    }
    .workspace-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
    .battery-badge {
      color: var(--green);
      border: 1px solid var(--divider);
      background: var(--raised);
      border-radius: 9px;
      font-family: Departure, monospace;
      font-size: 19px;
      padding: 10px 14px;
    }
    .header-close { margin-left: auto; color: var(--muted); }
    .surface-tabs {
      display: flex;
      gap: 12px;
      margin-top: 18px;
      overflow: hidden;
    }
    .surface-tab {
      height: 58px;
      padding: 0 20px;
      border-radius: 10px;
      background: var(--sunken);
      border: 2px solid var(--divider);
      color: var(--muted);
      font-size: 21px;
      display: flex;
      align-items: center;
      white-space: nowrap;
    }
    .surface-tab.active {
      background: var(--raised);
      border-color: var(--green);
      color: var(--green);
    }
    .surface-tab.new { color: var(--green); border-color: rgba(158,206,106,.7); }

    .terminal {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 36px 30px;
      overflow: hidden;
      background:
        repeating-linear-gradient(to bottom, rgba(255,255,255,.018), rgba(255,255,255,.018) 1px, transparent 1px, transparent 6px),
        #000;
      color: var(--terminal-text);
      font-size: 23px;
      line-height: 1.55;
      letter-spacing: -.4px;
    }
    .term-line { min-height: 35px; white-space: pre; }
    .t-green { color: var(--green); }
    .t-blue { color: var(--blue); }
    .t-cyan { color: var(--cyan); }
    .t-yellow { color: var(--yellow); }
    .t-orange { color: var(--orange); }
    .t-red { color: var(--red); }
    .t-magenta { color: var(--magenta); }
    .t-purple { color: var(--purple); }
    .t-muted { color: var(--muted); }
    .cursor {
      display: inline-block;
      width: 12px;
      height: 27px;
      background: var(--green);
      vertical-align: -5px;
      box-shadow: 0 0 15px rgba(158,206,106,.75);
    }

    .selection-band {
      position: absolute;
      left: 24px;
      right: 74px;
      top: 298px;
      height: 160px;
      border: 3px solid rgba(241,242,248,.92);
      border-radius: 12px;
      background: rgba(122,162,247,.38);
      box-shadow: 0 0 0 1px rgba(0,0,0,.8);
      pointer-events: none;
    }
    .selection-handle {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--blue);
      border: 4px solid white;
      box-shadow: 0 6px 16px rgba(0,0,0,.55);
    }
    .selection-handle.start { left: -12px; top: -14px; }
    .selection-handle.end { right: -14px; bottom: -14px; }
    .selection-actions {
      position: absolute;
      right: 36px;
      top: 470px;
      display: flex;
      gap: 12px;
      padding: 14px;
      border: 2px solid var(--divider);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 18px 42px rgba(0,0,0,.62);
    }
    .selection-actions span {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 2px solid var(--divider);
      color: var(--ink);
      background: var(--raised);
      font-size: 28px;
    }
    .selection-actions .copy {
      color: var(--canvas);
      background: var(--blue);
      border-color: var(--blue);
    }

    .accessory {
      flex: none;
      padding: 22px;
      margin: 0 24px 24px;
      border: 2px solid var(--divider);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 -18px 55px rgba(0,0,0,.65);
    }
    .composer {
      height: 82px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      border: 2px solid var(--divider);
      border-radius: 13px;
      background: var(--sunken);
      color: var(--ink);
      font-size: 24px;
    }
    .mode {
      padding: 10px 13px;
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--green);
      font-family: Departure, monospace;
      font-size: 17px;
    }
    .prompt { color: var(--green); font-family: Departure, monospace; }
    .composer .draft { color: var(--ink-dim); overflow: hidden; white-space: nowrap; }
    .action-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .action-key {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      border: 2px solid var(--divider);
      color: var(--ink);
      background: var(--raised);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-family: Departure, monospace;
    }
    .action-key.send {
      margin-left: auto;
      color: var(--canvas);
      background: var(--green);
      border-color: var(--green);
      font-size: 31px;
    }
    .action-key.highlight {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(122,162,247,.14);
    }
    .shortcut-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .shortcut {
      flex: 1;
      height: 54px;
      border-radius: 8px;
      border: 1px solid var(--divider);
      color: var(--ink);
      background: var(--sunken);
      font-family: Departure, monospace;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .files-sheet {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1040px;
      border-radius: 42px 42px 0 0;
      background: var(--surface);
      box-shadow: 0 -30px 90px rgba(0,0,0,.72);
      overflow: hidden;
      border-top: 2px solid var(--divider);
    }
    .sheet-grabber {
      width: 110px;
      height: 10px;
      margin: 18px auto 14px;
      border-radius: 9px;
      background: var(--muted);
    }
    .sheet-head {
      height: 150px;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid var(--divider);
    }
    .sheet-title { font-family: Departure, monospace; font-size: 31px; color: var(--ink); }
    .sheet-subtitle { margin-top: 12px; font-size: 20px; color: var(--ink-dim); }
    .sheet-buttons { margin-left: auto; display: flex; gap: 16px; }
    .sheet-button {
      width: 74px;
      height: 74px;
      border: 2px solid var(--divider);
      background: var(--sunken);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 28px;
    }
    .sheet-button.refresh { color: var(--blue); }
    .file-list { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .file-row {
      height: 210px;
      padding: 22px;
      display: flex;
      align-items: center;
      gap: 22px;
      border-radius: 22px;
      border: 2px solid var(--divider);
      background: var(--sunken);
    }
    .file-row.ready { border-color: var(--green); }
    .thumb {
      width: 150px;
      height: 150px;
      border-radius: 18px;
      border: 2px solid var(--divider);
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 26%, #f7768e 0 10%, transparent 11%),
        linear-gradient(140deg, #7aa2f7 0 33%, #bb9af7 33% 58%, #9ece6a 58% 100%);
      position: relative;
    }
    .thumb::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 20px;
      height: 46px;
      background: #1f2335;
      clip-path: polygon(0 100%, 22% 42%, 39% 68%, 65% 10%, 100% 100%);
    }
    .file-copy { min-width: 0; flex: 1; }
    .file-name {
      color: var(--ink);
      font-size: 27px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-meta { margin-top: 14px; color: var(--ink-dim); font-size: 20px; }
    .file-state { margin-top: 12px; color: var(--green); font-size: 20px; }
    .file-arrow { color: var(--muted); font-size: 40px; }
    .doc-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-dim);
      font-size: 50px;
      background: var(--raised);
    }
    .privacy-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 82px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 30px;
      color: var(--ink-dim);
      background: var(--sunken);
      font-size: 18px;
    }
    .privacy-footer .lock { color: var(--green); }

    .workspace-list-screen, .settings-screen {
      position: absolute;
      inset: 96px 0 0;
      padding: 40px 34px;
      background: var(--canvas);
      color: var(--ink);
    }
    .ipad .workspace-list-screen, .ipad .settings-screen { inset: 72px 0 0; }
    .list-title {
      font-family: Departure, monospace;
      font-size: 52px;
      letter-spacing: 1px;
    }
    .list-title .remote { color: var(--green); }
    .relay-status {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 20px;
    }
    .search {
      height: 78px;
      margin-top: 34px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      border: 2px solid var(--divider);
      border-radius: 14px;
      background: var(--sunken);
      color: var(--muted);
      font-size: 24px;
    }
    .search .slash { color: var(--green); font-family: Departure, monospace; }
    .rule {
      margin: 32px 0 18px;
      color: var(--muted);
      font-family: Departure, monospace;
      font-size: 19px;
      letter-spacing: 2px;
    }
    .workspace-cards { display: flex; flex-direction: column; gap: 16px; }
    .workspace-card {
      min-height: 126px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      border: 2px solid var(--divider);
      border-radius: 16px;
      background: var(--surface);
    }
    .workspace-card.active { background: var(--raised); }
    .workspace-index {
      width: 74px;
      height: 74px;
      border: 2px solid var(--divider);
      border-radius: 12px;
      background: var(--sunken);
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Departure, monospace;
      font-size: 24px;
    }
    .workspace-card.active .workspace-index { border-color: var(--green); color: var(--green); }
    .workspace-copy { min-width: 0; }
    .workspace-card h4 { margin: 0; font-size: 27px; font-weight: 500; }
    .workspace-card p { margin: 9px 0 0; color: var(--muted); font-size: 19px; }
    .workspace-card p b { color: var(--blue); font-weight: 500; }
    .workspace-arrow { margin-left: auto; color: var(--green); font-size: 32px; }
    .card-icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--divider);
      border-radius: 11px;
      background: var(--sunken);
      color: var(--muted);
      font-size: 22px;
    }

    .settings-title { font-family: Departure, monospace; font-size: 50px; }
    .settings-card {
      margin-top: 28px;
      padding: 28px;
      border: 2px solid var(--divider);
      border-radius: 20px;
      background: var(--surface);
    }
    .settings-rule {
      color: var(--muted);
      font-family: Departure, monospace;
      font-size: 20px;
      letter-spacing: 2px;
    }
    .guide-step {
      display: flex;
      gap: 18px;
      margin-top: 24px;
    }
    .step-index {
      width: 46px;
      height: 46px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--divider);
      border-radius: 8px;
      color: var(--green);
      background: var(--sunken);
      font-family: Departure, monospace;
      font-size: 18px;
    }
    .step-copy h4 { margin: 0; color: var(--ink); font-size: 22px; font-weight: 500; }
    .step-copy p { margin: 7px 0 0; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .connect-field {
      height: 66px;
      margin-top: 22px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      border: 1px solid var(--divider);
      border-radius: 10px;
      color: var(--ink);
      background: var(--sunken);
      font-size: 19px;
    }
    .connect-button {
      height: 64px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: var(--canvas);
      background: var(--green);
      font-family: Departure, monospace;
      font-size: 19px;
    }
    .settings-description {
      margin-top: 20px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.48;
    }
    .settings-action {
      height: 64px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: var(--canvas);
      background: var(--blue);
      font-family: Departure, monospace;
      font-size: 19px;
    }
    .settings-label {
      margin-top: 20px;
      color: var(--muted);
      font-family: Departure, monospace;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .connection-state {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 17px;

            <div class="toggle-copy"><div class="toggle-title">LOCAL IOS NOTIFICATIONS</div><div class="toggle-description">${s.notifications}</div></div>
            <div class="toggle"></div>
          </div>
        </div>
      </div>`;
    }

    function pills(items) {
      return `<div class="float-pill-row">${items.map((item, index) => `<div class="float-pill"><span class="dot">${index === 0 ? "●" : "›"}</span>${item}</div>`).join("")}</div>`;
    }

    function phoneFrame() {
      let screen = "";
      let outside = pills(text.labels.chips[frame - 1]);
      if (frame === 1) screen = terminalScreen();
      if (frame === 2) {
        screen = terminalScreen({selection: true});
        outside += `<div class="float-card"><div class="copy-icon">▣</div><h3>${text.labels.copyTitle}</h3><p>${text.labels.copySub}</p></div>`;
      }
      if (frame === 3) {
        screen = `${terminalScreen()}${filesSheet()}`;
        outside += `<div class="float-card"><div class="float-preview"></div><div class="preview-label">${text.labels.preview}</div></div>`;
      }
      if (frame === 4) screen = terminalScreen({highlight: true});
      if (frame === 5) screen = settingsScreen();
      return `<div class="device phone-device"><div class="phone-screen">${screen}</div></div>${outside}`;
    }

    function ipadFrame() {
      let screen = "";
      if (frame === 1) screen = terminalScreen({workspace: "cmux remote · release"});
      if (frame === 2) screen = `${terminalScreen({workspace: "cmux remote · assets"})}${filesSheet()}`;
      if (frame === 3) screen = workspaceList(true);
      return `<div class="device ipad-device"><div class="ipad-screen">${screen}</div></div>${pills(text.labels.ipadChips[frame - 1])}`;
    }

    const stage = document.getElementById("stage");
    stage.innerHTML = `
      <div class="soft-glow glow-one"></div><div class="soft-glow glow-two"></div>
      <div class="brand"><span class="brand-dot"></span><span>cmux <strong>remote</strong></span><span class="version">1.1.1</span></div>
      <div class="headline">${caption[0]}</div>
      <div class="sub">${caption[1]}</div>
      ${device === "phone" ? phoneFrame() : ipadFrame()}
    `;
  </script>
</body>
</html>
